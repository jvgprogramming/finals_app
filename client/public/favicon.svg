  <!-- Cherry stem -->
  <path d="M32 6 Q33 3 35 2" fill="none" stroke="#2d6a4f" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Decorative dots on bottom tier -->
  <circle cx="22" cy="46" r="1.5" fill="#f0e0d0"/>
  <circle cx="32" cy="48" r="1.5" fill="#f0e0d0"/>
  <circle cx="42" cy="46" r="1.5" fill="#f0e0d0"/>
  <!-- Decorative dots on middle tier -->
  <circle cx="27" cy="30" r="1.2" fill="#f5e6d0"/>
  <circle cx="37" cy="30" r="1.2" fill="#f5e6d0"/>
  <!-- Candle -->
  <rect x="31" y="4" width="2" height="5" rx="0.5" fill="#ffd166"/>
  <!-- Flame -->
  <ellipse cx="32" cy="3" rx="1.5" ry="2.5" fill="#ff9f1c"/>
  <ellipse cx="32" cy="2.5" rx="0.8" ry="1.5" fill="#ffd166"/>
