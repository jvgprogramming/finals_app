  <path d="M16 36 Q18 40 20 36 Q22 42 24 36 Q26 41 28 36 Q30 43 32 36 Q34 40 36 36 Q38 42 40 36 Q42 41 44 36 Q46 39 48 36" fill="#f0e0d0"/>
  <!-- Middle tier -->
  <rect x="20" y="22" width="24" height="14" rx="3" fill="#e8a87c"/>
  <rect x="20" y="22" width="24" height="4" rx="2" fill="#f0b892"/>
