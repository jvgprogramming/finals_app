  <path d="M22 22 Q24 26 26 22 Q28 27 30 22 Q32 26 34 22 Q36 27 38 22 Q40 25 42 22" fill="#f5e6d0"/>
  <!-- Top tier -->
  <rect x="25" y="12" width="14" height="10" rx="3" fill="#f4c2c2"/>
  <rect x="25" y="12" width="14" height="3" rx="2" fill="#f8d4d4"/>
  <!-- Top frosting -->
  <path d="M27 12 Q28 15 30 12 Q32 16 34 12 Q36 15 38 12" fill="#fff0f0"/>
  <!-- Cherry on top -->
  <circle cx="32" cy="9" r="3" fill="#e63946"/>
